<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InstallEmbly</title><link rel="icon" type="image/png" href="icon.png"><link rel="stylesheet" href="style.css"><script src="app.js" defer></script></head>
<body>
<aside class="sidebar"><div class="brand"><img class="brand-mark" src="icon.png" alt=""><div>InstallEmbly<span>BUILDER WORKSPACE</span></div></div><div class="nav-label">프로젝트 설정</div><nav id="navigation"></nav><div class="side-note"><span class="dot"></span> 자체 MSI 엔진<div>프로젝트 하나로<br>배포 준비를 간편하게.</div></div></aside>
<div class="workspace"><header><div><span class="eyebrow">INSTALLEMBLY</span><div class="file-title" id="file-title">새 프로젝트 <span class="unsaved" id="dirty">저장되지 않음</span></div></div><div class="toolbar"><button id="new">새 프로젝트</button><button id="open">열기</button><button id="save" class="primary">저장</button><button id="save-as" class="icon-button" title="다른 이름으로 저장">다른 이름으로</button></div></header>
<main><section class="content"><div class="page-heading"><div><span id="section-number" class="eyebrow">01 / PROJECT</span><h1 id="heading">제품 정보</h1><p id="subtitle">프로그램의 이름과 버전, 설치 패키지의 식별 정보를 설정하세요.</p></div><span class="tag" id="architecture-tag">Windows · x64</span></div><div id="panel"></div></section>
<aside class="summary"><div class="summary-label">PACKAGE OVERVIEW</div><div class="package-icon"><img src="icon.png" alt="설치 패키지"></div><h2 id="summary-name">MyApp</h2><div id="summary-version">1.0.0 · x64</div><dl id="summary-details"></dl><div class="summary-hint">설정은 .embproj 파일에 저장됩니다.<br>빌드는 프로그램을 설치하지 않습니다.</div><button class="primary build-button" id="build">MSI 빌드 <span>→</span></button><button class="plain" id="validate">프로젝트 검사</button><button class="plain" id="output" disabled>출력 폴더 열기 ↗</button></aside>
</main><footer><span id="status"><span class="dot"></span> 준비됨</span><span id="project-path">프로젝트를 저장해 시작하세요.</span></footer></div>
<div id="toast" role="status" hidden></div>
<dialog id="entry-dialog"><form id="entry-form"><div class="modal-heading"><h2 id="entry-title">항목 편집</h2><button type="button" id="entry-close" class="plain">닫기 ✕</button></div><div id="entry-fields"></div><div id="entry-error" class="error" role="alert"></div><div class="modal-actions"><button type="button" id="entry-cancel">취소</button><button type="submit" class="primary">적용</button></div></form></dialog>
<dialog id="confirm-dialog"><h2 id="confirm-title"></h2><p id="confirm-text"></p><div class="modal-actions"><button id="confirm-no">취소</button><button id="confirm-yes" class="primary">계속</button></div></dialog>
</body></html>
